description = 'Smart Client for Jersey 3.x - includes a SmartClientFactory'

dependencies {
    api project(':smart-client-core')
    api 'org.glassfish.jersey.core:jersey-client:3.1.11'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'org.glassfish.jersey.connectors:jersey-apache-connector:3.1.11'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.11'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.fasterxml.jackson.jakarta.rs:jackson-jakarta-rs-json-provider:2.17.3'
    implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.17.3'
    // jaxb was removed from Java 11 - provide explicit JAXB dependencies
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jersey.media:jersey-media-jaxb:3.1.11'
    runtimeOnly 'org.glassfish.jaxb:jaxb-runtime:4.0.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'ch.qos.logback:logback-classic:1.5.12'
    testImplementation 'commons-codec:commons-codec:1.17.1'
}

test {
    useJUnitPlatform()
}
